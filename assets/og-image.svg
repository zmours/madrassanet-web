<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A237E"/>
      <stop offset="0.55" stop-color="#3949AB"/>
      <stop offset="1" stop-color="#009688"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3949AB"/>
      <stop offset="1" stop-color="#009688"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="260" fill="#ffffff" opacity="0.05"/>
  <circle cx="150" cy="560" r="200" fill="#00BFA5" opacity="0.08"/>
  <!-- logo -->
  <g transform="translate(90,90)">
    <rect width="72" height="72" rx="18" fill="url(#chip)"/>
    <text x="36" y="50" font-size="38" text-anchor="middle">🎓</text>
    <text x="92" y="48" fill="#ffffff" font-size="40" font-weight="800">MadrassaNET</text>
  </g>
  <!-- headline -->
  <text x="90" y="270" fill="#ffffff" font-size="58" font-weight="800">Le logiciel de gestion</text>
  <text x="90" y="340" fill="#ffffff" font-size="58" font-weight="800">tout-en-un pour</text>
  <text x="90" y="410" fill="#80DEEA" font-size="58" font-weight="800">écoles coraniques &amp; madrasas</text>
  <!-- subline -->
  <text x="90" y="475" fill="#ffffff" opacity="0.85" font-size="28" font-weight="500">Inscriptions · Présences · Notes · Bulletins PDF · Finances</text>
  <!-- badges -->
  <g transform="translate(90,520)">
    <rect width="230" height="56" rx="28" fill="#ffffff"/>
    <text x="115" y="37" fill="#1A237E" font-size="24" font-weight="700" text-anchor="middle">🌍 FR · EN · العربية</text>
    <rect x="252" width="270" height="56" rx="28" fill="#ffffff" opacity="0.16"/>
    <text x="387" y="37" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">1&#8364; / élève / an</text>
  </g>
  <text x="1110" y="600" fill="#ffffff" opacity="0.7" font-size="24" font-weight="600" text-anchor="end">www.madrassanet.com</text>
</svg>
